services:
  - type: web
    name: prakritidesk-api
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: |
      apt-get update && apt-get install -y tesseract-ocr tesseract-ocr-hin
      pip install -r requirements-render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.6-27b
      - key: GROQ_VISION_MODEL
        value: llama-3.2-11b-vision-instruct
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./prakritidesk.db
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TESSERACT_LANG
        value: eng+hin
      - key: LOCAL_LLM_ENABLED
        value: false
    disk:
      name: prakritidesk-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
