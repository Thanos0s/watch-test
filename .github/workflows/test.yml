name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend (Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intake-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: intake-engine/requirements.txt

      - name: Install system Tesseract (native OCR fallback)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-hin

      - run: pip install -r requirements.txt

      - name: Run pytest
        env:
          # No real Groq key in CI -- unit/integration tests assert
          # against this codebase's documented graceful-degradation
          # behavior, not live LLM output. See tests/conftest.py.
          GROQ_API_KEY: ci-dummy-key
        run: pytest -v --junitxml=pytest-results.xml

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: intake-engine/pytest-results.xml

  frontend-e2e-tests:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    needs: backend-tests
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js app
        run: npm run build

      - name: Start Next.js app in the background
        run: npm run start &

      - name: Wait for the app to be reachable
        run: npx wait-on http://127.0.0.1:3000

      - name: Run Playwright E2E suite
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
